name: Podcast Card Simple
description: Compact h-48 horizontal card with episode cover art, title, and duration — for listing/grid views.
group: Podcast

props:
  type: object
  properties:
    url:
      type: string
      title: Episode URL
    label:
      type: string
      title: Episode title
    ep_art:
      type: string
      title: Cover image URL
      description: URL to the episode cover art. Falls back to the default show artwork when empty.

slots:
  audio_player:
    title: Audio player field
    description: Rendered content.field_mp3 — sits inside the cover art container.
  subtitle:
    title: Episode subtitle field
  duration:
    title: Duration field
