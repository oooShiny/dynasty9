dynasty_search.api_games:
  path: '/dynasty/search/games'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchDataController::games'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dynasty_search.api_highlights:
  path: '/dynasty/search/highlights'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchDataController::highlights'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dynasty_search.games_page:
  path: '/search/games'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchPageController::gamesPage'
    _title: 'Game Search'
  requirements:
    _access: 'TRUE'

dynasty_search.highlights_page:
  path: '/search/highlights'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchPageController::highlightsPage'
