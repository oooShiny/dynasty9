dynasty_search.api_games:
  path: '/dynasty/search/games'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchDataController::games'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dynasty_search.api_highlights:
  path: '/dynasty/search/highlights'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchDataController::highlights'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dynasty_search.games_page:
  path: '/search/games'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchPageController::gamesPage'
    _title: 'Game Search'
  requirements:
    _access: 'TRUE'

dynasty_search.highlights_page:
  path: '/search/highlights'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchPageController::highlightsPage'
    _title: 'Highlight Search'
  requirements:
    _access: 'TRUE'

dynasty_search.api_stats:
  path: '/dynasty/search/stats'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchDataController::stats'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dynasty_search.api_play_by_play:
  path: '/dynasty/search/play-by-play'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchDataController::playByPlay'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dynasty_search.plays_page:
  path: '/search/plays'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchPageController::playsPage'
    _title: 'Play Search'
  requirements:
    _access: 'TRUE'

dynasty_search.stats_page_redirect:
  path: '/search/stats'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchPageController::statsPageRedirect'
  requirements:
    _access: 'TRUE'

dynasty_search.play_by_play_page_redirect:
  path: '/search/play-by-play'
  defaults:
    _controller: '\Drupal\dynasty_search\Controller\SearchPageController::playByPlayPageRedirect'
  requirements:
    _access: 'TRUE'
